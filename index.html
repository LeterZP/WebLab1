<!DOCTYPE html>
<html lang="ru_RU">
    <head>
        <meta charset="UTF-8">
        <title>ЛР1 Босенко Борис</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th colspan="6">  
                        <p>Босенко Борис Игоревич</p>
                        <p>Группа P3215</p>
                        <p>Вариант 12725</p>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="canvas" colspan="3">
                        <canvas id="canvas" height="300" width="300">Рисунок</canvas>
                    </td>
                    <td colspan="3">
                        <form name="form">
                            <fieldset>
                                <legend>X</legend>
                                <input type="radio" name="X" value="-2" required><label>-2</label>
                                <input type="radio" name="X" value="-1.5"><label>-1.5</label>
                                <input type="radio" name="X" value="-1"><label>-1</label>
                                <input type="radio" name="X" value="-0.5"><label>-0.5</label>
                                <input type="radio" name="X" value="0"><label>0</label>
                                <input type="radio" name="X" value="0.5"><label>0.5</label>
                                <input type="radio" name="X" value="1"><label>1</label>
                                <input type="radio" name="X" value="1.5"><label>1.5</label>
                                <input type="radio" name="X" value="2"><label>2</label>
                            </fieldset>
                            <fieldset>
                                <legend>Y</legend>
                                <input type="text" name="Y" placeholder="Any number from -5 to 3" required>
                            </fieldset>
                            <fieldset>
                                <legend>R</legend>
                                <input type="button" name="R" value="1" disabled>
                                <input type="button" name="R" value="1.5">
                                <input type="button" name="R" value="2">
                                <input type="button" name="R" value="2.5">
                                <input type="button" name="R" value="3">
                            </fieldset>
                            <input class="button" type="submit">
                            <input class="button" type="reset">
                            <p id="message"><br></p>
                            <button id="clear" class="button" type="button">Сбросить таблицу</button>
                        </form>
                    </td>
                </tr>
            </tbody>
            <tfoot id="storage">
                <tr>
                    <th>Номер</th>
                    <th>Координата X</th>
                    <th>Координата Y</th>
                    <th>Радиус</th>
                    <th>Попадание</th>
                    <th>Время</th>
                </tr>
            </tfoot>
        </table>
    </body>
    <script type="text/javascript" src="script.js"></script>
</html>
