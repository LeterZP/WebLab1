<!DOCTYPE html>
<html lang="ru_RU">
    <head>
        <meta charset="UTF-8">
        <title>ЛР1 Босенко Борис</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th colspan="2">Босенко Борис Игоревич, Группа P3215, Вариант 12725</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="canvas">
                        <canvas id="canvas" height="300" width="300">Рисунок</canvas>
                    </td>
                    <td>
                        <form name="form">
                            <fieldset>
                                <legend>X</legend>
                                <label><input type="radio" name="X" value="-2">-2</label>
                                <label><input type="radio" name="X" value="-1.5">-1.5</label>
                                <label><input type="radio" name="X" value="-1">-1</label>
                                <label><input type="radio" name="X" value="-0.5">-0.5</label>
                                <label><input type="radio" name="X" value="0">0</label>
                                <label><input type="radio" name="X" value="0.5">0.5</label>
                                <label><input type="radio" name="X" value="1">1</label>
                                <label><input type="radio" name="X" value="1.5">1.5</label>
                                <label><input type="radio" name="X" value="2">2</label>
                            </fieldset>
                            <fieldset>
                                <legend>Y</legend>
                                <input type="text" class="Y">
                            </fieldset>
                            <fieldset>
                                <legend>R</legend>
                                <input type="button" class="R" value="1">
                                <input type="button" class="R" value="1.5">
                                <input type="button" class="R" value="2">
                                <input type="button" class="R" value="2.5">
                                <input type="button" class="R" value="3">
                            </fieldset>
                            <input type="submit">
                            <input type="reset">
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
    <script type="text/javascript" src="script.js"></script>
</html>
